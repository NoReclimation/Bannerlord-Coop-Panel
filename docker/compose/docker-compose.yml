# PostgreSQL for local / single-host development
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bannerlord
      POSTGRES_PASSWORD: bannerlord
      POSTGRES_DB: bannerlord_panel
    ports:
      - "5432:5432"
    volumes:
      - bannerlord_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bannerlord -d bannerlord_panel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bannerlord_pg_data:
